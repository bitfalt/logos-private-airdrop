[workspace]
members = [
    "airdrop_core",
    "airdrop_program",
    "cli",
    "methods/guest",
    "sdk/rust",
    "ui/ffi",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitfalt/logos-private-airdrop"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
airdrop_core = { path = "airdrop_core" }
airdrop_program = { path = "airdrop_program" }
borsh = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
